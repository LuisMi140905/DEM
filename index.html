<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador Paramétrico: Laminadora PET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; overflow: hidden; }
        
        #app-container { display: flex; height: 100vh; width: 100vw; }
        #canvas-container { flex: 1; position: relative; background: radial-gradient(circle at center, #1e293b 0%, #020617 100%); display: flex; align-items: center; justify-content: center; overflow: hidden;}
        #ui-container { width: 450px; background: #1e293b; border-left: 1px solid #334155; display: flex; flex-direction: column; z-index: 10; box-shadow: -5px 0 25px rgba(0,0,0,0.5);}
        
        canvas { display: block; }
        
        .header { padding: 1.5rem; background: #0f172a; border-bottom: 1px solid #334155; }
        .step-content { flex: 1; padding: 1.5rem; overflow-y: auto; }
        .footer { padding: 1.5rem; background: #0f172a; border-top: 1px solid #334155; display: flex; justify-content: space-between; gap: 1rem; }
        
        .card-option { 
            background: #334155; border: 2px solid transparent; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; 
            cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 1rem;
        }
        .card-option:hover { background: #475569; transform: translateY(-2px); }
        .card-option.selected { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        
        .btn { padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; border: none; flex: 1; text-align: center;}
        .btn-primary { background: #0ea5e9; color: white; }
        .btn-primary:hover { background: #0284c7; }
        .btn-primary:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        .btn-secondary { background: transparent; color: #cbd5e1; border: 1px solid #475569; }
        .btn-secondary:hover { background: #334155; }
        
        .input-fuerza { background: #0f172a; border: 1px solid #38bdf8; color: #38bdf8; font-size: 1.25rem; font-weight: bold; padding: 0.5rem; border-radius: 6px; width: 100px; text-align: center;}

        #result-modal {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center; z-index: 50; backdrop-filter: blur(5px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #result-modal.active { opacity: 1; pointer-events: auto; }
        .modal-box { background: #1e293b; padding: 2.5rem; border-radius: 12px; max-width: 650px; width: 90%; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); transform: translateY(20px); transition: transform 0.3s; }
        #result-modal.active .modal-box { transform: translateY(0); }
        
        .grid-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .hud { position: absolute; top: 20px; left: 20px; color: #38bdf8; font-family: monospace; font-size: 14px; pointer-events: none; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="canvas-container">
        <div class="grid-overlay"></div>
        <div class="hud" id="hud-text">CAM: WIDE | FOCUS: NONE</div>
        <canvas id="viewCanvas"></canvas>
    </div>
    
    <div id="ui-container">
        <div class="header">
            <h1 class="text-xl font-bold text-white">Ingeniería Paramétrica</h1>
            <p class="text-sm text-slate-400" id="step-indicator">Paso 1 de 4: Parámetros Base</p>
        </div>
        
        <div class="step-content" id="step-panel"></div>
        
        <div class="footer">
            <button class="btn btn-secondary" id="btn-prev" style="visibility: hidden;">Atrás</button>
            <button class="btn btn-primary" id="btn-next" disabled>Siguiente</button>
        </div>
    </div>
</div>

<div id="result-modal">
    <div class="modal-box">
        <div class="text-center mb-6">
            <i id="result-icon" class="fa-solid fa-check-circle text-6xl mb-4 text-emerald-400"></i>
            <h2 id="result-title" class="text-3xl font-bold mb-2">Estado</h2>
            <p id="result-msg" class="text-slate-300 text-lg">Mensaje de diagnóstico.</p>
        </div>
        
        <div id="calc-report" class="bg-slate-900 rounded p-4 font-mono text-sm text-sky-300 mb-6 whitespace-pre-line border border-slate-700 max-h-64 overflow-y-auto">
            Cálculos...
        </div>

        <div class="flex gap-4">
            <button class="btn btn-secondary" onclick="editComponents()">Editar Componentes</button>
            <button class="btn btn-primary" onclick="resetConfig()">Nuevo Diseño</button>
        </div>
    </div>
</div>

<script>
    const state = {
        step: 1,
        fuerza: 450,
        selections: { roller: null, shaft: null, shaftMat: null, bearing: null, motor: null, trans: null },
        camZoom: 1, camTargetZoom: 1, camPanX: 0, camTargetPanX: 0, camPanY: 0, camTargetPanY: 0,
        animTime: 0, simulating: false, failType: null
    };

    const catalog = {
        rollers: [
            { id: 4, title: 'Rodillo 4" (101.6mm)', desc: 'Pequeño. Ángulo de ataque agudo.', icon: 'fa-circle-notch' },
            { id: 6, title: 'Rodillo 6" (152.4mm)', desc: 'Estándar industrial.', icon: 'fa-circle' },
            { id: 8, title: 'Rodillo 8" (203.2mm)', desc: 'Masivo. Excelente agarre.', icon: 'fa-compact-disc' }
        ],
        shafts: [
            { id: 20, title: 'Flecha Ø20 mm', desc: 'Ligera.', icon: 'fa-minus' },
            { id: 25, title: 'Flecha Ø25 mm', desc: 'Estándar.', icon: 'fa-minus' },
            { id: 35, title: 'Flecha Ø35 mm', desc: 'Robusta.', icon: 'fa-equals' },
            { id: 50, title: 'Flecha Ø50 mm', desc: 'Uso Extremo.', icon: 'fa-bars' }
        ],
        materials: [
            { id: 185, title: 'Acero 1018 (Sy: 185 MPa)', desc: 'Baja resistencia.' },
            { id: 310, title: 'Acero 1045 (Sy: 310 MPa)', desc: 'Estándar de la industria.' },
            { id: 415, title: 'Acero 4140 (Sy: 415 MPa)', desc: 'Alta resistencia tratada.' }
        ],
        skfBearings: [
            { id: '22204 E', d: 20, C0: 40000, title: 'SKF 22204 E', desc: 'Carga Estática (C0): 40 kN' },
            { id: '22205 E', d: 25, C0: 48000, title: 'SKF 22205 E', desc: 'Carga Estática (C0): 48 kN' },
            { id: '22305 E', d: 25, C0: 78000, title: 'SKF 22305 E (Pesada)', desc: 'Carga Estática (C0): 78 kN' },
            { id: '22207 E', d: 35, C0: 85000, title: 'SKF 22207 E', desc: 'Carga Estática (C0): 85 kN' },
            { id: '22307 E', d: 35, C0: 129000, title: 'SKF 22307 E (Pesada)', desc: 'Carga Estática (C0): 129 kN' },
            { id: '22210 E', d: 50, C0: 108000, title: 'SKF 22210 E', desc: 'Carga Estática (C0): 108 kN' }
        ],
        motors: [
            { id: 0.5, title: 'Motorreductor 0.5 HP', desc: 'Básico.' },
            { id: 2.0, title: 'Motorreductor 2.0 HP', desc: 'Industrial.' },
            { id: 5.0, title: 'Motorreductor 5.0 HP', desc: 'Fuerza bruta.' }
        ],
        transmissions: [
            { id: 'gear_1020', maxTorque: 50, title: 'Engranes Acero 1020', desc: 'Frágiles bajo impacto.' },
            { id: 'gates_8mgt', maxTorque: 120, title: 'Banda Gates PowerGrip', desc: 'Suave, torque medio.' },
            { id: 'renold_16b', maxTorque: 300, title: 'Cadena Renold 16B-1', desc: 'Rodillos estándar. Torque masivo.' }
        ]
    };

    const panel = document.getElementById('step-panel');
    const btnNext = document.getElementById('btn-next');
    const btnPrev = document.getElementById('btn-prev');
    const stepInd = document.getElementById('step-indicator');
    const hud = document.getElementById('hud-text');
    const canvas = document.getElementById('viewCanvas');
    const ctx = canvas.getContext('2d');

    function resize() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; }
    window.addEventListener('resize', resize); resize();

    function renderStep() {
        panel.innerHTML = '';
        btnPrev.style.visibility = state.step > 1 ? 'visible' : 'hidden';
        btnNext.disabled = true; 
        
        if (state.step === 1) {
            stepInd.innerText = "Paso 1 de 4: Carga y Rodillos";
            btnNext.innerText = "Siguiente";
            hud.innerText = "CAM: WIDE | FOCUS: ZONA DE APLASTAMIENTO";
            
            panel.innerHTML = `
                <div class="flex justify-between items-center bg-slate-800 p-4 rounded-lg mb-6 border border-slate-700">
                    <div>
                        <div class="text-sm text-slate-400">Fuerza de la Botella (f)</div>
                        <div class="text-xs text-slate-500">Valor obtenido en prueba física</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="number" id="fuerzaInput" class="input-fuerza" value="${state.fuerza}" onchange="state.fuerza = this.value">
                        <span class="text-sky-400 font-bold">N</span>
                    </div>
                </div>
                <h3 class="mb-4 text-sky-400 font-semibold">Diámetro del Rodillo (D)</h3>
            `;
            catalog.rollers.forEach(opt => {
                const isSelected = state.selections.roller === opt.id;
                if (isSelected) btnNext.disabled = false;
                panel.innerHTML += `
                    <div class="card-option ${isSelected ? 'selected' : ''}" onclick="selectOption('roller', ${opt.id})">
                        <i class="fa-solid ${opt.icon} text-2xl w-8 text-center text-slate-400"></i>
                        <div><div class="font-bold text-white">${opt.title}</div><div class="text-xs text-slate-400">${opt.desc}</div></div>
                    </div>`;
            });
            setCamera(1.5, 0, 0); 
            
        } else if (state.step === 2) {
            stepInd.innerText = "Paso 2 de 4: Flecha y Material";
            hud.innerText = "CAM: ZOOM IN | FOCUS: CENTRO DE FLECHA";
            
            panel.innerHTML = `<h3 class="mb-4 text-sky-400 font-semibold">1. Diámetro Comercial de la Flecha (d)</h3>`;
            catalog.shafts.forEach(opt => {
                const isSelected = state.selections.shaft === opt.id;
                panel.innerHTML += `
                    <div class="card-option py-3 ${isSelected ? 'selected' : ''}" onclick="selectOption('shaft', ${opt.id}, true)">
                        <div><div class="font-bold text-white">${opt.title}</div></div>
                    </div>`;
            });

            panel.innerHTML += `<h3 class="mt-6 mb-4 text-sky-400 font-semibold">2. Material del Eje (Resistencia Sy)</h3>`;
            catalog.materials.forEach(opt => {
                const isSelected = state.selections.shaftMat === opt.id;
                panel.innerHTML += `
                    <div class="card-option py-2 ${isSelected ? 'selected' : ''}" onclick="selectOption('shaftMat', ${opt.id}, true)">
                        <div class="text-sm font-bold text-white">${opt.title}</div>
                    </div>`;
            });
            
            if (state.selections.shaft && state.selections.shaftMat) btnNext.disabled = false;
            setCamera(3.5, 0, 0);

        } else if (state.step === 3) {
            stepInd.innerText = "Paso 3 de 4: Apoyos SKF";
            hud.innerText = "CAM: PAN RIGHT | FOCUS: EXTREMO DEL EJE";
            
            const skfFiltrados = catalog.skfBearings.filter(rod => rod.d === state.selections.shaft);

            panel.innerHTML = `
                <div class="p-3 bg-emerald-900/40 border border-emerald-700 rounded-lg mb-4 text-sm text-emerald-200">
                    <i class="fa-solid fa-filter mr-2"></i>Catálogo SKF filtrado para flecha de <strong>${state.selections.shaft} mm</strong>.
                </div>
                <div class="p-3 bg-amber-900/40 border border-amber-700 rounded-lg mb-4 text-sm text-amber-200">
                    <i class="fa-solid fa-circle-info mr-2"></i><strong>Nota de Diseño:</strong> Se preseleccionaron rodamientos de rodillos a rótula (autoalineables) para absorber el pandeo de la flecha.
                </div>
                <h3 class="mb-4 text-sky-400 font-semibold">Selecciona Rodamiento Autoalineable</h3>
            `;
            skfFiltrados.forEach(opt => {
                const isSelected = state.selections.bearing === opt.id;
                if (isSelected) btnNext.disabled = false;
                panel.innerHTML += `
                    <div class="card-option ${isSelected ? 'selected' : ''}" onclick="selectOption('bearing', '${opt.id}')">
                        <i class="fa-solid fa-ring text-2xl w-8 text-center text-slate-400"></i>
                        <div><div class="font-bold text-white">${opt.title}</div><div class="text-xs text-slate-400">${opt.desc}</div></div>
                    </div>`;
            });
            setCamera(2.0, -100, 0);

        } else if (state.step === 4) {
            stepInd.innerText = "Paso 4 de 4: Potencia y Transmisión";
            btnNext.innerText = "SIMULAR DISEÑO";
            hud.innerText = "CAM: WIDE | FOCUS: TREN CINEMÁTICO";
            
            panel.innerHTML = `<h3 class="mb-4 text-sky-400 font-semibold">1. Motorreductor</h3>`;
            catalog.motors.forEach(opt => {
                const isSelected = state.selections.motor === opt.id;
                panel.innerHTML += `
                    <div class="card-option py-2 ${isSelected ? 'selected' : ''}" onclick="selectOption('motor', ${opt.id}, true)">
                        <div class="text-sm font-bold text-white">${opt.title}</div>
                    </div>`;
            });

            panel.innerHTML += `<h3 class="mt-6 mb-4 text-sky-400 font-semibold">2. Tipo de Transmisión</h3>`;
            catalog.transmissions.forEach(opt => {
                const isSelected = state.selections.trans === opt.id;
                panel.innerHTML += `
                    <div class="card-option ${isSelected ? 'selected' : ''}" onclick="selectOption('trans', '${opt.id}', true)">
                        <div><div class="font-bold text-sm text-white">${opt.title}</div><div class="text-xs text-slate-400">${opt.desc}</div></div>
                    </div>`;
            });
            
            if (state.selections.motor && state.selections.trans) btnNext.disabled = false;
            setCamera(0.8, 150, 0);
        }
    }

    function selectOption(key, value, checkBoth = false) {
        state.selections[key] = value;
        if(key === 'shaft') state.selections.bearing = null; 
        renderStep();
    }

    function setCamera(zoom, px, py) {
        state.camTargetZoom = zoom; state.camTargetPanX = px; state.camTargetPanY = py;
    }

    btnNext.addEventListener('click', () => {
        if (state.step < 4) { state.step++; renderStep(); } 
        else { runSimulation(); }
    });

    btnPrev.addEventListener('click', () => {
        if (state.step > 1) { state.step--; renderStep(); }
    });

    function evaluateDesign() {
        const F = parseFloat(state.fuerza);
        const D_rodillo_m = (state.selections.roller * 25.4) / 1000;
        const d_flecha_m = state.selections.shaft / 1000;
        const Sy_MPa = state.selections.shaftMat;
        const motor_HP = state.selections.motor;
        const trans_id = state.selections.trans;
        const bearing_id = state.selections.bearing;

        const skfData = catalog.skfBearings.find(b => b.id === bearing_id);
        const transData = catalog.transmissions.find(t => t.id === trans_id);

        let report = `[ECUACIONES APLICADAS]\n`;
        report += `• Torque (T) = F × r_rodillo\n`;
        report += `• Esfuerzo ASME (τ) = [16 / (π·d³)] · √((Kb·Mb)² + (Kt·Mt)²)\n`;
        report += `• Reacción Apoyo (R) = F / 2\n`;
        report += `────────────────────────────────────\n\n`;

        if (state.selections.roller === 4 && F > 100) {
            return { ok: false, type: 'slip', report, msg: "Falla Cinemática: El rodillo es muy pequeño. La botella rebota." };
        }

        const T_req = F * (D_rodillo_m / 2);
        const P_watts = motor_HP * 745.7;
        const w_rads = (30 * 2 * Math.PI) / 60;
        const T_motor = P_watts / w_rads;

        report += `T_req: ${T_req.toFixed(1)} N·m | T_motor: ${T_motor.toFixed(1)} N·m\n`;

        if (T_motor < T_req) {
            return { ok: false, type: 'stall', report, msg: `Falla Motriz: El motor de ${motor_HP} HP se estancó.` };
        }

        const M_b = (F * 0.2) / 4; 
        const K_b = 1.5; const K_t = 1.0; 
        
        const tau_max_Pa = (16 / (Math.PI * Math.pow(d_flecha_m, 3))) * Math.sqrt(Math.pow(K_b * M_b, 2) + Math.pow(K_t * T_motor, 2));
        const tau_max_MPa = tau_max_Pa / 1000000;

        report += `Esfuerzo (τ): ${tau_max_MPa.toFixed(1)} MPa | Límite (Sy): ${Sy_MPa} MPa\n`;

        if (tau_max_MPa > Sy_MPa) {
            return { ok: false, type: 'break', report, msg: `Falla Estructural: El esfuerzo superó la resistencia. Flecha degollada.` };
        }

        if (T_motor > transData.maxTorque) {
            return { ok: false, type: 'break', report, msg: `Falla de Transmisión: ${transData.title} no soportó el torque.` };
        }

        const Reaccion_apoyo_N = F / 2;
        report += `Reacción (R): ${Reaccion_apoyo_N.toFixed(1)} N | Cap. SKF: ${skfData.C0} N\n`;

        if (Reaccion_apoyo_N > skfData.C0) {
            return { ok: false, type: 'stall', report, msg: `Falla SKF: Capacidad estática superada. Elija la Serie Pesada.` };
        }

        return { ok: true, type: 'success', report, msg: "¡Diseño Validado por Código ASME y Catálogos Comerciales!" };
    }

    function runSimulation() {
        const result = evaluateDesign();
        state.failType = result.ok ? null : result.type;
        state.simulating = true;
        
        setCamera(1, 0, 0);
        hud.innerText = "SIMULACIÓN EN PROGRESO...";
        
        setTimeout(() => {
            showResultModal(result.ok, result.msg, result.report);
            state.simulating = false;
        }, 2500);
    }

    function showResultModal(isSuccess, msg, reportText) {
        const modal = document.getElementById('result-modal');
        const icon = document.getElementById('result-icon');
        const title = document.getElementById('result-title');
        
        document.getElementById('result-msg').innerText = msg;
        document.getElementById('calc-report').innerText = reportText;
        
        modal.classList.add('active');
        if (isSuccess) {
            icon.className = "fa-solid fa-check-circle text-6xl mb-4 text-emerald-400";
            title.innerText = "Simulación Exitosa";
            title.className = "text-3xl font-bold mb-2 text-emerald-400";
        } else {
            icon.className = "fa-solid fa-triangle-exclamation text-6xl mb-4 text-rose-500";
            title.innerText = "Falla de Diseño Crítica";
            title.className = "text-3xl font-bold mb-2 text-rose-500";
        }
    }

    function resetConfig() {
        document.getElementById('result-modal').classList.remove('active');
        state.step = 1;
        state.failType = null;
        state.selections = { roller: null, shaft: null, shaftMat: null, bearing: null, motor: null, trans: null };
        renderStep();
    }

    function editComponents() {
        document.getElementById('result-modal').classList.remove('active');
        state.failType = null;
        state.simulating = false;
        setCamera(0.8, 150, 0);
        hud.innerText = "CAM: WIDE | FOCUS: TREN CINEMÁTICO";
    }

    function draw() {
        state.camZoom += (state.camTargetZoom - state.camZoom) * 0.1;
        state.camPanX += (state.camTargetPanX - state.camPanX) * 0.1;
        state.camPanY += (state.camTargetPanY - state.camPanY) * 0.1;
        state.animTime += 0.05;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(canvas.width/2 + state.camPanX, canvas.height/2 + state.camPanY);
        ctx.scale(state.camZoom, state.camZoom);
        
        const rSize = state.selections.roller ? state.selections.roller * 10 : 60;
        const sSize = state.selections.shaft ? state.selections.shaft : 25;
        let rotation = state.animTime;
        
        if (state.simulating) {
            if (state.failType === 'stall') rotation = Math.sin(state.animTime * 5) * 0.1;
            else if (state.failType === 'slip') rotation = state.animTime * 2;
            else if (state.failType === 'break') rotation = 0;
        } else if (state.step > 0) { rotation = 0; }

        if (state.step >= 4 || state.simulating) {
            ctx.save();
            ctx.translate(-150, 0);
            
            ctx.fillStyle = state.selections.trans === 'renold_16b' ? '#94a3b8' : (state.selections.trans === 'gates_8mgt' ? '#1e293b' : '#64748b');
            ctx.beginPath(); ctx.arc(0, 0, rSize * 0.8, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 4; ctx.stroke();
            
            for(let i=0; i<12; i++) {
                ctx.save();
                ctx.rotate(rotation + (i * Math.PI/6));
                ctx.fillStyle = state.selections.trans === 'gates_8mgt' ? '#334155' : '#475569';
                ctx.fillRect(-10, -rSize*0.8 - 10, 20, 20);
                ctx.restore();
            }

            if (state.selections.motor) {
                const mSize = state.selections.motor === 5.0 ? 120 : (state.selections.motor === 2.0 ? 80 : 50);
                ctx.fillStyle = '#0ea5e9'; ctx.fillRect(-mSize/2 - 50, -mSize/2, mSize, mSize);
            }
            ctx.restore();
        }

        ctx.save();
        ctx.rotate(rotation);
        
        const grad = ctx.createRadialGradient(0, 0, rSize*0.1, 0, 0, rSize);
        grad.addColorStop(0, '#94a3b8'); grad.addColorStop(1, '#334155');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, 0, rSize, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.stroke();
        
        ctx.fillStyle = '#cbd5e1';
        ctx.beginPath(); ctx.arc(0, 0, sSize, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        if (state.simulating && state.failType === 'break') {
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(-sSize, -sSize); ctx.lineTo(sSize, sSize); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(sSize, -sSize); ctx.lineTo(-sSize, sSize); ctx.stroke();
        }
        ctx.restore();

        if (state.step >= 3 || state.simulating) {
            ctx.save();
            const bWidth = sSize * 3; const bHeight = sSize * 1.8;
            ctx.fillStyle = '#0284c7'; ctx.globalAlpha = 0.8;
            ctx.beginPath(); ctx.moveTo(-bWidth, bHeight); ctx.lineTo(bWidth, bHeight);
            ctx.lineTo(bWidth*0.7, 0); ctx.arc(0, 0, sSize + 15, 0, Math.PI, true);
            ctx.lineTo(-bWidth*0.7, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.restore();
        }

        if (state.simulating) {
            ctx.save();
            let bottleY = -200 + (state.animTime * 30);
            if (state.failType === 'slip') bottleY = -rSize - 40 + Math.sin(state.animTime * 10)*10;
            if (state.failType === 'stall' || state.failType === 'break') bottleY = -rSize - 20;
            if (bottleY > 300 && state.failType === null) bottleY = -200;

            ctx.fillStyle = 'rgba(186, 230, 253, 0.6)'; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
            let width = 60;
            if (bottleY > -rSize && bottleY < rSize && state.failType === null) width = 10;
            ctx.fillRect(-width/2, bottleY, width, 100); ctx.strokeRect(-width/2, bottleY, width, 100);
            ctx.restore();
        }

        ctx.restore();
        requestAnimationFrame(draw);
    }

    renderStep(); draw();
</script>
</body>
</html>
